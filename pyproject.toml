[project]
name = "system-prompt-injection"
version = "0.1.0"
description = "Single-source synchronization for local agent system prompt blocks"
requires-python = ">=3.9"
dependencies = []

[tool.ruff]
target-version = "py39"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
