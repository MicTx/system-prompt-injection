[project]
name = "system-prompt-injection"
version = "1.0.0"
description = "Minimal single-file TUI that syncs one shared prompt block into local agent files"
requires-python = ">=3.9"
dependencies = []

[tool.ruff]
target-version = "py39"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
